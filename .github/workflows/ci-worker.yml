name: External Worker Tests
on:
  workflow_call:
  push:
    branches-ignore:
      - main
      - 'translations**'
  pull_request:
    branches-ignore:
      - 'translations**'
  workflow_dispatch:
concurrency:
  group: worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test standalone worker
        run: |
          docker run --rm --userns=host \
            --mount type=bind,src="${GITHUB_WORKSPACE}/providers/paperless-inference",dst=/source,readonly \
            ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim \
            sh -ec '
              apt-get update
              apt-get install --yes --no-install-recommends git default-jre-headless ghostscript fonts-dejavu-core
              cp -a /source /tmp/worker
              cd /tmp/worker
              ./install-verapdf.sh
              uv run --frozen pytest
            '
