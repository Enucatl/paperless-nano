[project]
name = "paperless-inference"
version = "0.1.0"
description = "Standalone PaddleOCR and metadata worker for the Paperless operation API"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
  "shared-inference @ git+https://github.com/Enucatl/shared-inference.git@8fe5f2e1ba8eb2dc65166d60d141b8fb28f77049",
  "niquests>=3.0",
  "pypdf>=6.19",
  "PyMuPDF==1.27.2.3",
  "fonttools>=4.62",
  "json-repair>=0.25",
  "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=0.23", "pillow>=10", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Preserve the qualified worker dependency versions independently of the server.
[tool.uv]
constraint-dependencies = [
  "annotated-types==0.7.0",
  "charset-normalizer==3.4.4",
  "colorama==0.4.6",
  "fonttools==4.62.0",
  "h11==0.16.0",
  "iniconfig==2.3.0",
  "packaging==26.0",
  "pillow==13.0.0",
  "pluggy==1.6.0",
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "pygments==2.20.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.16.9",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
]
