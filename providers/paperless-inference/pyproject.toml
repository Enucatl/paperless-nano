[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "paperless-inference"
version = "0.1.0"
description = "OCR and rich metadata proposal providers for Paperless-ngx"
license = "GPL-3.0-only"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "fonttools>=4.62",
  "json-repair>=0.25",
  "niquests>=3",
  "pydantic>=2",
  "pymupdf==1.27.2.3",
  "pypdf>=6.19",
  "shared-inference @ git+https://github.com/Enucatl/shared-inference.git@8fe5f2e1ba8eb2dc65166d60d141b8fb28f77049",
]

[dependency-groups]
dev = [ "pillow>=10", "pytest>=9", "pytest-asyncio>=0.23", "ruff>=0.16" ]

# Keep the installed core runtime unchanged when extending its release image.
[tool.uv]
constraint-dependencies = [
  "annotated-types==0.7.0",
  "charset-normalizer==3.4.4",
  "colorama==0.4.6",
  "fonttools==4.62.0",
  "h11==0.16.0",
  "iniconfig==2.3.0",
  "packaging==26.0",
  "pillow==13.0.0",
  "pluggy==1.6.0",
  "pydantic-core==2.41.5",
  "pydantic==2.12.5",
  "pygments==2.20.0",
  "pytest-asyncio==1.3.0",
  "pytest==9.1.1",
  "ruff==0.16.9",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
]

[tool.ruff]
lint.select = [ "E4", "E7", "E9", "F" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.asyncio_mode = "auto"
