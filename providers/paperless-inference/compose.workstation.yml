services:
  workstation:
    image: ${PAPERLESS_WORKSTATION_IMAGE:?Set the standalone worker image}
    restart: unless-stopped
    userns_mode: host
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PAPERLESS_URL: ${PAPERLESS_URL:?Set the Paperless API base URL}
      PAPERLESS_API_TOKEN_FILE: /run/secrets/paperless_api_token
      PAPERLESS_WORKSTATION_STATE_DIR: /workstation
      INFERENCE_OCR_ENDPOINT: ${INFERENCE_OCR_ENDPOINT:?Set this worker's OCR endpoint}
      INFERENCE_OCR_PIPELINE: PaddleOCR-VL-1.6
      INFERENCE_OCR_MODEL: PaddlePaddle/PaddleOCR-VL-1.6
      INFERENCE_OCR_LAYOUT_MODEL: PP-DocLayoutV3
      INFERENCE_OCR_TIMEOUT: "600"
      INFERENCE_METADATA_ENDPOINT: ${INFERENCE_METADATA_ENDPOINT:-https://openrouter.ai/api/v1}
      INFERENCE_METADATA_MODEL: ${INFERENCE_METADATA_MODEL:?Set this worker's metadata model}
      INFERENCE_METADATA_TEMPERATURE: "0"
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - paperless_api_token
      - openrouter_api_key
    volumes:
      - workstation_state:/workstation
secrets:
  paperless_api_token:
    file: ${PAPERLESS_API_TOKEN_SECRET_FILE:?Set the private API token file}
  openrouter_api_key:
    file: ${OPENROUTER_SECRET_FILE:?Set the private model credential file}
volumes:
  workstation_state:
