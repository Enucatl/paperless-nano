# Paperless Nano core; external workers have independent images.
# See docs/processor-deployment.md before starting ingestion.
services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?Set PAPERLESS_DBPASS in .env}
  webserver:
    image: ${PAPERLESS_IMAGE:-ghcr.io/enucatl/paperless-nano:latest}
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file: inference.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?Set PAPERLESS_DBPASS in .env}
      PAPERLESS_PROCESSOR_USER: server-processor
      PAPERLESS_PROCESSOR_CAPABILITIES: search ingestion
      PAPERLESS_PARSER: documents.external_workers.ExternalParser
      PAPERLESS_ENRICHMENT_PROVIDER: documents.external_workers.ExternalMetadata
      PAPERLESS_ENRICHMENT_ALLOW_REMOTE: "true"
      PAPERLESS_REMOTE_OCR_MODE: always
volumes:
  data:
  media:
  pgdata:
  redisdata:
